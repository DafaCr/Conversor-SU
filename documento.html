<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta DNI / RUC</title>

  <!-- Aplica el tema guardado ANTES de pintar la página, para -->
  <!-- evitar el parpadeo de un color equivocado al cargar.      -->
  <script>
    (function () {
      try {
        var tema = localStorage.getItem("tema") || "oscuro";
        document.documentElement.setAttribute("data-tema", tema);
      } catch (e) {}
    })();
  </script>

  <!-- Favicons e íconos -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css?v=22">
</head>
<body>

  <button type="button" id="interruptor-tema" class="interruptor-tema" role="switch" aria-checked="false" aria-label="Cambiar entre modo oscuro y modo claro">
    <span class="interruptor-icono interruptor-icono--sol" aria-hidden="true">☀</span>
    <span class="interruptor-pista"><span class="interruptor-bola"></span></span>
    <span class="interruptor-icono interruptor-icono--luna" aria-hidden="true">☾</span>
  </button>

  <main class="tarjeta">
    <a href="/" class="volver-link" id="link-volver">← Volver</a>

    <div class="marca">
      <img src="logo.png?v=2" alt="ENSERIO UNA QUEJA?" class="marca-logo">
    </div>
    <h1 class="titulo">Consulta DNI / RUC</h1>

    <label for="input-documento" class="etiqueta">Número de documento</label>
    <input
      type="text"
      id="input-documento"
      class="input-codigo"
      inputmode="numeric"
      autocomplete="off"
      autocorrect="off"
      spellcheck="false"
      placeholder="Escribe el DNI o RUC…"
      autofocus
    >

    <section id="resultado-doc" class="resultado resultado--vacio" aria-live="polite">
      <div id="filas-doc" class="lista-codigos"></div>
      <p id="mensaje-error-doc" class="mensaje-error" hidden></p>
      <button id="btn-buscar-doc" class="btn-buscar-discreto" type="button" title="Buscar" aria-label="Buscar documento">🔍</button>
    </section>

    <p class="contador">11 dígitos se busca como RUC · cualquier otra cantidad se busca como DNI · Esc para volver</p>
  </main>

  <p class="pie">Developed by Damner F. Carranza R.</p>

  <script src="config.js?v=2"></script>
  <script src="consulta.js?v=7"></script>
  <script src="theme.js?v=1"></script>
</body>
</html>
